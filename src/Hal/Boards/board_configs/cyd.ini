; =========================================================================
; ENVIRONMENT: ESP32-CYD-28 (Cheap Yellow Display / ESP32 + ILI9341 + XPT2046)
; =========================================================================
; Active copy of examples/cyd.ini, registered in [platformio] extra_configs so it can be built
; with `pio run -e esp32-cyd-28`. It is still NOT in default_envs: nothing builds it unless asked.
; The matching implementation is src/Hal/Boards/cyd/BoardConfig.cpp, compiled only when TARGET_CYD
; is defined.

[env:esp32-cyd-28]
; Pinned to the pioarduino espressif32 distribution (Arduino core 3.3.12 / IDF 5.5). The plain
; `espressif32` spec resolves to whatever happens to be installed under that name locally, which is
; not reproducible; see Documentation/Display_Touch_Architecture.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
; min_spiffs is the upstream CYD's own table, and the only 4 MB layout with two app slots: app0 and
; app1, 0x1E0000 (1,966,080) bytes each. In-place OTA needs both, so this is what the update path
; requires — huge_app's single 3 MB slot has nowhere to stream an update into.
;
; The price is the filesystem: spiffs drops from 896 KB to 128 KB. That is arithmetic rather than a
; preference — 4 MB cannot hold a 3 MB app, ~900 KB of LittleFS and two 1.9 MB OTA slots at once.
; FileSystem.cpp keeps /apps on LittleFS, so installed apps have notably less room than under the
; huge_app build. If it proves tight, a custom table dropping coredump buys 192 KB of spiffs while
; keeping both slots.
;
; The app fits the smaller slot because of two levers in the build_flags below: the web pages are
; served precompressed, and the never-taken DWARF unwind tables are stripped. Neither alone is
; enough and neither costs a feature.
;
; Two one-time consequences of changing the table: the first flash orphans the existing LittleFS
; (spiffs moves from 0x310000 to 0x3D0000), and a partition table cannot be changed by OTA — so
; this build has to go on over the wire once before in-place updates can work at all.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson @ 7.1.0
    mathieucarbou/ESPAsyncWebServer @ 3.1.5
    links2004/WebSockets @ ^2.4.1
    nitek/XPT2046_Bitbang_Slim@^2.0.0

; The platform recipe puts -fexceptions on the C++ command line *after* build_flags, so adding
; -fno-exceptions below would lose the race; it has to be removed here.
build_unflags =
    -fexceptions

build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D TARGET_CYD=1

    ; --- OTA manifest branch ---
    ; This fork hosts its own manifests, one branch per chip variant. The CYD is the classic-ESP32
    ; variant, so it reads updates/esp32/v2/update.json from the esp32 branch. KRYONOS_OTA_VARIANT
    ; names that branch in OTAManager.cpp; the manifest *key* this board matches on comes from
    ; TARGET_CYD above, through getBoardTargetName().
    -D KRYONOS_OTA_VARIANT=\"esp32\"

    ; --- Loop task stack ---
    ; Every other environment in platformio.ini sets this; the CYD was the one that did not, and so
    ; ran on the Arduino core's 8192-byte default (cores/esp32/main.cpp). That is too small for the
    ; OTA path: startFlashUpdate() is called straight from handleUpdaterTouch() on the loop task, so
    ; an 8 KB stack has to hold the 4096-byte download buffer, the HTTPClient/TLS client, and -- on
    ; every progress tick -- a full-screen redraw through TFT_eSPI's font renderer. Exhausting it
    ; panics the loop task and resets the chip with nothing drawn, which is indistinguishable on
    ; screen from a failed update. Match the other envs.
    -D ARDUINO_LOOP_STACK_SIZE=32768

    ; --- No C++ exceptions, no unwind tables ---
    ; The image carries ~48 KB of .eh_frame, all of it dead: .gcc_except_table is empty, nothing in
    ; src/ or the libdeps uses try/throw/catch, and duk_config.h undefines Duktape's C++ exception
    ; support. It is present only because the SDK's cpp_flags carries -fexceptions without
    ; -fno-asynchronous-unwind-tables. Scoped to this env rather than globally to keep the blast
    ; radius small. If a library ever fails to compile under -fno-exceptions, drop to the two
    ; unwind-only flags and re-measure -- they are where most of the saving is.
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables

    ; --- Logical canvas: 240x320 post-rotation, the CYD's native panel. Same values as the
    ; fallback in DisplayConfig.h, spelled out so this environment is self-describing. ---
    -D KRYONOS_DISPLAY_WIDTH=240
    -D KRYONOS_DISPLAY_HEIGHT=320
    -D KRYONOS_DISPLAY_ROTATION=0

    ; --- TFT_eSPI Configuration Guard & Driver ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000

    ; --- Resistive Touch Pins (XPT2046) ---
    -D USE_HSPI_PORT=1
    -D TOUCHSCREEN_MOSI_PIN=32
    -D TOUCHSCREEN_MISO_PIN=39
    -D TOUCHSCREEN_SCLK_PIN=25
    -D TOUCHSCREEN_CS_PIN=33

    ; --- SD Card SPI Pins ---
    -D SD_SCK_PIN=18
    -D SD_MISO_PIN=19
    -D SD_MOSI_PIN=23
    -D SD_CS_PIN=5

    ; --- RGB LED Pins ---
    -D CYD_LED_RED=4
    -D CYD_LED_GREEN=16
    -D CYD_LED_BLUE=17

    ; --- Fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    ; SMOOTH_FONT is deliberately not enabled: TFT_eSPI's anti-aliased .vlw font renderer costs
    ; flash and nothing in KryonOS loads a free font.