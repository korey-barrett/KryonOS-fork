; =========================================================================
; ENVIRONMENT: ESP32-CYD-28 (Cheap Yellow Display / ESP32 + ILI9341 + XPT2046)
; =========================================================================

[env:esp32-cyd-28]
; Pinned to the pioarduino espressif32 distribution (Arduino core 3.3.12 / IDF 5.5). The plain
; `espressif32` spec resolves to whatever happens to be installed under that name locally, which is
; not reproducible; see Documentation/Display_Touch_Architecture.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
monitor_speed = 115200

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson @ 7.1.0
    mathieucarbou/ESPAsyncWebServer @ 3.1.5
    links2004/WebSockets @ ^2.4.1
    nitek/XPT2046_Bitbang_Slim@^2.0.0

build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D TARGET_CYD=1

    ; --- TFT_eSPI Configuration Guard & Driver ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000

    ; --- Resistive Touch Pins (XPT2046) ---
    -D USE_HSPI_PORT=1
    -D TOUCHSCREEN_MOSI_PIN=32
    -D TOUCHSCREEN_MISO_PIN=39
    -D TOUCHSCREEN_SCLK_PIN=25
    -D TOUCHSCREEN_CS_PIN=33

    ; --- SD Card SPI Pins ---
    -D SD_SCK_PIN=18
    -D SD_MISO_PIN=19
    -D SD_MOSI_PIN=23
    -D SD_CS_PIN=5

    ; --- RGB LED Pins ---
    -D CYD_LED_RED=4
    -D CYD_LED_GREEN=16
    -D CYD_LED_BLUE=17

    ; --- Fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    ; SMOOTH_FONT is deliberately not enabled: TFT_eSPI's anti-aliased .vlw font renderer costs
    ; flash and nothing in KryonOS loads a free font. This app partition has ~2 KB of headroom.