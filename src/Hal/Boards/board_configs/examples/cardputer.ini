; =========================================================================
; ENVIRONMENT: M5Stack Cardputer v1.1
; Stamp-S3A + ST7789V2 240x135 SPI + 56-Key Keyboard Matrix + Battery ADC
; =========================================================================

[env:m5stack-cardputer]
; Pinned to the pioarduino espressif32 distribution (Arduino core 3.3.12 / IDF 5.5). The plain
; `espressif32` spec resolves to whatever happens to be installed under that name locally, which is
; not reproducible; see Documentation/Display_Touch_Architecture.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.filesystem = littlefs
board_build.partitions = src/Hal/Boards/cardputer/partitions_cardputer.csv
monitor_speed = 115200

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson @ 7.1.0
    mathieucarbou/ESPAsyncWebServer @ 3.1.5
    links2004/WebSockets @ ^2.4.1

build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D TARGET_CARDPUTER=1
    -D ESP32S3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_LOOP_STACK_SIZE=32768

    ; --- Display Dimensions (logical canvas AFTER rotation) ---
    ; The panel is natively 135x240; rotation 1 gives the 240x135 landscape canvas the UI targets.
    -D KRYONOS_DISPLAY_WIDTH=240
    -D KRYONOS_DISPLAY_HEIGHT=135
    -D KRYONOS_DISPLAY_ROTATION=1
    ; Legacy aliases (honoured for one release; prefer the KRYONOS_DISPLAY_* names)
    -D DISP_HOR_RES=240
    -D DISP_VER_RES=135

    ; --- TFT_eSPI Configuration Guard & Driver ---
    -D USER_SETUP_LOADED=1
    -D ST7789_2_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D USE_HSPI_PORT=1

    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240

    ; --- ST7789V2 Cardputer v1.1 Pinout ---
    -D TFT_MOSI=35
    -D TFT_SCLK=36
    -D TFT_DC=34
    -D TFT_RST=33
    -D TFT_CS=37
    -D TFT_BL=38
    -D TFT_BACKLIGHT_ON=HIGH

    ; --- SPI Speeds ---
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000

    ; --- Fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    ; SMOOTH_FONT is deliberately not enabled: TFT_eSPI's anti-aliased .vlw font renderer
    ; costs flash and nothing in KryonOS loads a free font.