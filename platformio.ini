; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ------------------------------------------------------------------------------------------------
; This fork targets one DEFAULT BOARD PER CHIP TYPE. Each default is a starting point for your own
; hardware, not a specific product: it assumes a generic SPI TFT (ILI9341) plus an XPT2046 touch
; controller, and every pin/resolution value is overridable from the command line or from your own
; board snippet. Copy src/Hal/Boards/esp32/ or src/Hal/Boards/esp32s3/ and give it your own
; TARGET_<NAME> macro to add a named board.
;
; Panel size is a BUILD FLAG, never a code constant: edit the KRYONOS_DISPLAY_WIDTH / _HEIGHT /
; _ROTATION lines under the environment you are building. That is the only place the canvas is
; declared, and it is configuration, not code. See Documentation/Display_Touch_Architecture.md
; for the full contract.
;
; The three legacy board snippets (CYD, T-HMI, Cardputer) are kept as reference implementations
; under src/Hal/Boards/board_configs/examples/ and are NOT built by default.
; ------------------------------------------------------------------------------------------------

[platformio]
default_envs = esp32s3-default, esp32-default
; Opt-in named boards. An env registered here becomes buildable with `pio run -e <name>`, but it is
; still not built by a bare `pio run` — default_envs is what that builds. The CYD snippet is the
; reference board for the classic ESP32; see src/Hal/Boards/board_configs/examples/README.md.
extra_configs =
	src/Hal/Boards/board_configs/cyd.ini

[env]
; Dependencies shared by every environment. Environments inherit these; a child that declares its
; own `lib_deps` would replace (not extend) this list, so add new libraries here.
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson @ 7.1.0
	mathieucarbou/ESPAsyncWebServer @ 3.1.5
	links2004/WebSockets @ ^2.4.1

; Both embedded web pages are generated into a gzip header at build time rather than checked in as
; a blob that can go stale. Every environment compiles WebManager.cpp, so this is registered at
; [env] level; a child that declares its own extra_scripts would replace rather than extend it.
extra_scripts = pre:scripts/gzip_web_assets.py

; The vendored TFT_eSPI font tables under src/Hal/Display/fonts/ are fragments meant to be #included
; by KryonText.cpp, not translation units -- glcdfont.c declares its table static, and TFT_eSPI itself
; #includes all three for the same reason. PlatformIO compiles every .c it finds under src/, so
; without this exclusion each of the seven environments would try to compile a bare table on its own
; and fail with ~98 "expected ';' before 'const'". Excluded at [env] level because the problem is
; universal: the boards that never call the rasterizer still sweep the directory.
build_src_filter = +<*> -<Hal/Display/fonts/>

build_flags =
	-D KRYONOS_VERSION=\"2.0.2\"
	-D KRYONOS_API_LEVEL=2
	-D CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1

	; --- Display backend ---
	; Which KryonDisplay implementation the board file instantiates. This is compile-time, because
	; it picks a C++ type, so the value is a macro name and not a quoted string. The default is
	; KRYONOS_BACKEND_TFT_ESPI; select the RAM framebuffer to run with no panel attached:
	;     -D KRYONOS_DISPLAY_BACKEND=KRYONOS_BACKEND_RAM
	; See src/Hal/Display/DisplayConfig.h and Documentation/Display_Touch_Architecture.md §2.3.
	; -D KRYONOS_DISPLAY_BACKEND=KRYONOS_BACKEND_TFT_ESPI

; ================================================================================================
; ESP32-S3 (Xtensa LX7, 16 MB flash + PSRAM) — primary bring-up target
; ================================================================================================
[env:esp32s3-default]
; Pinned to the pioarduino espressif32 distribution (Arduino core 3.3.12 / IDF 5.5). The plain
; `espressif32` spec resolves to whatever happens to be installed under that name locally, which is
; not reproducible; see Documentation/Display_Touch_Architecture.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
monitor_speed = 115200

build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D TARGET_ESP32S3_DEFAULT=1
	-D BOARD_HAS_PSRAM
	-D CONFIG_SPIRAM_USE_MALLOC=1
	-D CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
	-D ARDUINO_LOOP_STACK_SIZE=32768
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

	; --- Logical canvas: CHANGE THESE for your panel (no code edits) ---
	; Must equal tft.width()/height() once tft.setRotation(KRYONOS_DISPLAY_ROTATION) has run.
	-D KRYONOS_DISPLAY_WIDTH=240
	-D KRYONOS_DISPLAY_HEIGHT=320
	-D KRYONOS_DISPLAY_ROTATION=0

	; --- TFT_eSPI display driver (pick the macro matching your controller) ---
	-D USER_SETUP_LOADED=1
	-D USE_HSPI_PORT=1
	-D ILI9341_DRIVER=1
	-D TFT_CS=10
	-D TFT_DC=9
	-D TFT_RST=8
	-D TFT_MISO=13
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000

	; --- Resistive touch (XPT2046, bit-banged by TouchDriver) ---
	; KRYONOS_TOUCH_DRIVER is auto-detected from these pins: all four present -> xpt2046-bitbang,
	; else TOUCH_CS -> xpt2046-tft, else none. Set it explicitly to override — the value is a
	; quoted string, e.g. for a capacitive panel:  -D KRYONOS_TOUCH_DRIVER=\"ft6236\"
	; (auto / xpt2046_bitbang / xpt2046_tft / ft6236 / gt911 / cst816 / null).
	; Capacitive controllers also need KRYONOS_TOUCH_I2C_SDA / _SCL, and KRYONOS_TOUCH_RST_PIN
	; if the reset line is wired. See Documentation/Display_Touch_Architecture.md §3.
	-D TOUCH_CS=7
	-D TOUCH_CLK=4
	-D TOUCH_DIN=5
	-D TOUCH_DO=6
	-D TOUCH_IRQ=14

	; --- Fonts ---
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	; SMOOTH_FONT is deliberately not enabled: TFT_eSPI's anti-aliased .vlw font renderer
	; costs flash and nothing in KryonOS loads a free font.

; ================================================================================================
; ESP32 (Xtensa LX6, 4 MB flash) — smallest supported target
; ================================================================================================
[env:esp32-default]
; Pinned to the pioarduino espressif32 distribution (Arduino core 3.3.12 / IDF 5.5). See above.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
; huge_app gives a 3 MB app partition against min_spiffs' 1.875 MB, at the cost of the second OTA
; slot — on a 4 MB ESP32 you cannot have a large app *and* two OTA slots. min_spiffs was full to
; 1,493 bytes, which blocked any further UI work on this target, so the app space wins here.
;
; Consequence: OTA *updates* do not work on this env. Update.begin() finds no update partition and
; fails with UPDATE_ERROR_NO_PARTITION, which OTAManager surfaces as an ordinary error — no crash,
; and confirmBootSuccessful() still marks the running app valid. The S3 default keeps full OTA.
; Give your own board a partition table sized to its actual flash.
board_build.partitions = huge_app.csv
monitor_speed = 115200

build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D TARGET_ESP32_DEFAULT=1
	-D ARDUINO_LOOP_STACK_SIZE=32768

	; --- Logical canvas: CHANGE THESE for your panel (no code edits) ---
	-D KRYONOS_DISPLAY_WIDTH=240
	-D KRYONOS_DISPLAY_HEIGHT=320
	-D KRYONOS_DISPLAY_ROTATION=0

	; --- TFT_eSPI display driver (VSPI pins by default on the classic ESP32) ---
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_CS=5
	-D TFT_DC=17
	-D TFT_RST=16
	-D TFT_MISO=19
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_BL=4
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000

	; --- Resistive touch (XPT2046, bit-banged by TouchDriver) ---
	; KRYONOS_TOUCH_DRIVER is auto-detected from these pins: all four present -> xpt2046-bitbang,
	; else TOUCH_CS -> xpt2046-tft, else none. Set it explicitly to override — the value is a
	; quoted string, e.g. for a capacitive panel:  -D KRYONOS_TOUCH_DRIVER=\"ft6236\"
	; (auto / xpt2046_bitbang / xpt2046_tft / ft6236 / gt911 / cst816 / null).
	; Capacitive controllers also need KRYONOS_TOUCH_I2C_SDA / _SCL, and KRYONOS_TOUCH_RST_PIN
	; if the reset line is wired. See Documentation/Display_Touch_Architecture.md §3.
	-D TOUCH_CS=15
	-D TOUCH_CLK=14
	-D TOUCH_DIN=13
	-D TOUCH_DO=12
	-D TOUCH_IRQ=27

	; --- Fonts ---
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1

; ================================================================================================
; Waveshare ESP32-S3-Touch-LCD-2.1B (480x480 round ST7701) — a NAMED board, not a chip default
; ================================================================================================
; This panel is RGB565 PARALLEL (`rgb_3wire_spi`), not SPI: 16 data lines plus DE/PCLK/VSYNC/HSYNC,
; with a 3-wire SPI-like bus used only to send init commands. TFT_eSPI drives SPI and 8-bit parallel
; panels only, so it CANNOT drive this one. The board therefore selects KRYONOS_BACKEND_RGB
; (src/Hal/Display/EspLcdRgbDisplay.h), which brings the panel up through ESP-IDF's esp_lcd_panel_rgb
; and rasterizes the UI with TFT_eSPI into a PSRAM sprite that is blitted to the panel.
;
; TFT_eSPI is still compiled here, but ONLY as a software rasterizer. USER_SETUP_LOADED makes the
; library take its entire configuration from -D macros, and TFT_WIDTH/TFT_HEIGHT size the phantom
; instance the sprite is created against. Deliberately NO pin macros are defined: that instance is
; never init()ed, and defining pins would collide with the I2C bus below -- I2CEngine refuses to
; open a bus whose pins match any TFT_*/TOUCH_* macro (see Documentation/Display_Touch_Architecture.md).
;
; Hardware: ESP32-S3, 16 MB flash, 8 MB octal PSRAM. Panel ST7701 480x480 (RGB pins DE=40, PCLK=41,
; VSYNC=39, HSYNC=38; backlight GPIO6). Panel reset, touch reset and the command-bus chip select
; live on a TCA9554 I2C expander at 0x20, which the backend drives.
; NOT in default_envs: this is one specific product, not the chip default.
[env:waveshare-s3-lcd21b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
monitor_speed = 115200

build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D TARGET_WAVESHARE_S3_LCD21B=1
	-D BOARD_HAS_PSRAM
	-D CONFIG_SPIRAM_USE_MALLOC=1
	; TFT_eSPI gates its 16bpp sprite allocator behind CONFIG_SPIRAM_SUPPORT
	; (Extensions/Sprite.cpp: `#if defined (ESP32) && defined (CONFIG_SPIRAM_SUPPORT)`), but the
	; Arduino-ESP32 S3 core names that same setting CONFIG_SPIRAM. Without this define the backend's
	; full-screen PSRAM canvas falls back to an internal calloc that cannot succeed and every draw
	; becomes a silent no-op.
	-D CONFIG_SPIRAM_SUPPORT=1
	-D ARDUINO_LOOP_STACK_SIZE=32768
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

	; --- Logical canvas ---
	; 201x268, NOT the panel's 480x480. The panel is a circle, so a 480x480 canvas loses its corners
	; to the bezel (the footer's UP and DN thirds are physically outside the glass). The backend
	; scales this canvas 96/67 into a 288x384 rect centred in the panel -- at that size the rect's
	; corners land exactly on the 480 px bezel. The panel's own size is BOARD_PANEL_W/H in
	; BoardConfig.h, because it is a hardware fact the ST7701 timings are written from, not a UI
	; resolution. Rotation stays 0: the aperture offset and the touch transform are both derived from
	; it, so the backend logs and ignores anything else.
	;
	; The canvas is 3:4, and that is what makes the size tunable at all: for any 3:4 canvas the
	; inscribed rect is ALWAYS 288x384, so shrinking the canvas magnifies the same picture without
	; moving a single pixel on the glass. 201x268 magnifies 96/67 = 1.433 against the 6/5 = 1.2 the
	; 240x320 canvas gave -- body text 19 px -> 23 px, list rows 36 px -> 43 px. 201 is the narrowest
	; that still fits the widest fixed row the UI draws: InstallerUI's three-button action row spans
	; 3*60 + 2*10 = 200 canvas px, and dialogButtonSpaced() pushes the outer two off the canvas
	; below that. Do not shrink past it without narrowing those call sites.
	-D KRYONOS_DISPLAY_WIDTH=201
	-D KRYONOS_DISPLAY_HEIGHT=268
	-D KRYONOS_DISPLAY_ROTATION=0

	; --- Display backend: RGB parallel panel via esp_lcd, not TFT_eSPI ---
	-D KRYONOS_DISPLAY_BACKEND=KRYONOS_BACKEND_RGB

	; --- Phantom TFT_eSPI: rasterizer only, never init()ed, therefore no pins ---
	; TFT_WIDTH/TFT_HEIGHT are deliberately NOT set here. The driver's own defines set them
	; unconditionally (TFT_Drivers/ILI9341_Defines.h), so a -D here loses the race and only earns a
	; "TFT_WIDTH redefined" warning in every translation unit. The phantom's geometry never matters:
	; the backend creates its canvas at the LOGICAL size via createSprite(), and every draw that
	; reaches the phantom's own width()/height() is one this backend implements itself.
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1

	; --- Touch: CST820 on the shared I2C bus ---
	; The panel's controller is a CST820, which answers to the CST816S register map, so the existing
	; `cst816` driver binds it unchanged. The chip-select / clock / data pins the XPT2046 path would
	; want stay undefined on purpose: I2CEngine::begin() refuses to open a bus on any pin a TFT_* or
	; TOUCH_* macro claims, so a stray TOUCH_DIN=15 would kill this bus (which the expander is also
	; on) rather than just mis-select a driver.
	;
	; There is deliberately no KRYONOS_TOUCH_RST_PIN: the controller's reset is EXIO2 on the TCA9554
	; expander, not a SoC pin, and that macro would drive an unconnected GPIO. The driver pulses the
	; expander instead, immediately before every probe -- which is the only moment that works, because
	; the part sleeps and stops acknowledging I2C between touches.
	-D KRYONOS_TOUCH_DRIVER=\"cst816\"
	-D KRYONOS_TOUCH_I2C_SDA=15
	-D KRYONOS_TOUCH_I2C_SCL=7

	; --- Fonts (the rasterizer draws every UI label through these) ---
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1

; ================================================================================================
; ESP32-S31 (RISC-V, 320 MHz, Wi-Fi 6, 16 MB flash + 16 MB PSRAM) — preview
; ================================================================================================
; The S31 needs ESP-IDF 6.1, which only arduino-esp32 4.x uses. That core is not released yet, so
; this environment pins the pioarduino PRE-RELEASE platform 61.04.00-RC1 (Arduino 4.0.0-RC1 /
; IDF 6.1) — the only spec that ships an esp32s31 toolchain and the matching framework libs. The
; ESP32 and ESP32-S3 defaults above stay on the stable 55.03.312-1 (Arduino 3.3.12 / IDF 5.5.5);
; PlatformIO resolves `platform` per environment, so the two cores coexist in one project.
;
; The board is Espressif's own ESP32-S31-Function-CoreBoard-1 (board JSON in the platform). Pins
; below are placeholders mirroring the S3 default — set TFT_*/TOUCH_* to your actual wiring.
;
; DELIBERATELY NOT IN default_envs: this is a preview toolchain and the OS has not been ported to
; the Arduino 4.x API yet. Build it explicitly with `pio run -e esp32s31-default` and add it to
; default_envs once it compiles.
[env:esp32s31-default]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32-s31-coreboard-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D TARGET_ESP32S31_DEFAULT=1
	-D ARDUINO_LOOP_STACK_SIZE=32768

	; --- Logical canvas: CHANGE THESE for your panel (no code edits) ---
	-D KRYONOS_DISPLAY_WIDTH=240
	-D KRYONOS_DISPLAY_HEIGHT=320
	-D KRYONOS_DISPLAY_ROTATION=0

	; --- TFT_eSPI display driver ---
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_CS=10
	-D TFT_DC=9
	-D TFT_RST=8
	-D TFT_MISO=13
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000

	; --- Resistive touch (XPT2046, bit-banged by TouchDriver) ---
	; KRYONOS_TOUCH_DRIVER is auto-detected from these pins: all four present -> xpt2046-bitbang,
	; else TOUCH_CS -> xpt2046-tft, else none. Set it explicitly to override — the value is a
	; quoted string, e.g. for a capacitive panel:  -D KRYONOS_TOUCH_DRIVER=\"ft6236\"
	; (auto / xpt2046_bitbang / xpt2046_tft / ft6236 / gt911 / cst816 / null).
	; Capacitive controllers also need KRYONOS_TOUCH_I2C_SDA / _SCL, and KRYONOS_TOUCH_RST_PIN
	; if the reset line is wired. See Documentation/Display_Touch_Architecture.md §3.
	-D TOUCH_CS=7
	-D TOUCH_CLK=4
	-D TOUCH_DIN=5
	-D TOUCH_DO=6
	-D TOUCH_IRQ=14

	; --- Fonts ---
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	; SMOOTH_FONT is deliberately not enabled: TFT_eSPI's anti-aliased .vlw font renderer
	; costs flash and nothing in KryonOS loads a free font.

; ================================================================================================
; ESP32-S31-Korvo-1 (Espressif's S31 board -- 800x480 RGB565 parallel panel, GT1151 touch)
; ================================================================================================
; The board this fork exists to add. Unlike esp32s31-default above, this is a real product, so the
; panel and the pins are the board's own rather than a placeholder mirroring the S3 default.
;
; WHY THIS BLOCK LOOKS UNLIKE EVERY OTHER ONE
;   TFT_eSPI is absent from lib_deps, and it cannot be present: nothing at any version compiles for
;   the S31 (Documentation/Display_Touch_Architecture.md 5.2 -- 130 errors inside TFT_eSPI's own
;   Processors/TFT_eSPI_ESP32.h). So the panel is driven by an esp_lcd RGB backend and the text comes
;   from KryonOS's ported rasterizer, with the TFT_eSPI.h shim supplying the colour and datum macros
;   that src/ already includes. That is why there are no TFT_* pin flags and no driver macro here:
;   they would name a library this environment deliberately does not build.
;
;   A child environment's lib_deps REPLACES the [env] list rather than extending it, which is the only
;   mechanism by which one board can drop a shared library. The three that remain are listed in full.
[env:esp32s31-korvo1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32-s31-coreboard-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

; No bodmer/TFT_eSPI -- see the note above.
lib_deps =
	bblanchon/ArduinoJson @ 7.1.0
	mathieucarbou/ESPAsyncWebServer @ 3.1.5
	links2004/WebSockets @ ^2.4.1

build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D TARGET_ESP32S31_KORVO1=1
	-D ARDUINO_LOOP_STACK_SIZE=32768

	; --- Display: an esp_lcd RGB parallel backend, not TFT_eSPI ---
	-D KRYONOS_DISPLAY_BACKEND=KRYONOS_BACKEND_RGB
	; Selects the KryonSprite/KryonText rasterizer and puts the TFT_eSPI.h shim on the include path.
	; Both compile to nothing on the boards that have the real library.
	-D KRYONOS_KRYON_SPRITE=1
	; The panel's own size, 1:1 with the canvas: this panel is a plain rectangle, so there is no
	; aperture scale and no separate logical canvas the way the Waveshare 2.1B needs one.
	-D KRYONOS_DISPLAY_WIDTH=800
	-D KRYONOS_DISPLAY_HEIGHT=480
	-D KRYONOS_DISPLAY_ROTATION=0

	; --- Touch: a GT1151 at 0x14 on the board's own I2C bus ---
	; Named explicitly rather than auto-detected: this controller is found at a known address over
	; I2C rather than inferred from a pin being defined, so the ladder has nothing to detect.
	-D KRYONOS_TOUCH_DRIVER=\"gt1151\"
	-D KRYONOS_TOUCH_I2C_SDA=0
	-D KRYONOS_TOUCH_I2C_SCL=1

	; --- Include path: the TFT_eSPI.h shim ---
	; src/Hal/Display is on no other environment's path, which is what keeps the shim from shadowing
	; the real library for the boards that have it.
	-I src/Hal/Display
