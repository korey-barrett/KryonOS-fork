; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ------------------------------------------------------------------------------------------------
; This fork targets one DEFAULT BOARD PER CHIP TYPE. Each default is a starting point for your own
; hardware, not a specific product: it assumes a generic SPI TFT (ILI9341) plus an XPT2046 touch
; controller, and every pin/resolution value is overridable from the command line or from your own
; board snippet. Copy src/Hal/Boards/esp32/ or src/Hal/Boards/esp32s3/ and give it your own
; TARGET_<NAME> macro to add a named board.
;
; Panel size is a BUILD FLAG, never a code constant: edit the KRYONOS_DISPLAY_WIDTH / _HEIGHT /
; _ROTATION lines under the environment you are building. That is the only place the canvas is
; declared, and it is configuration, not code. See Documentation/Display_Touch_Architecture.md
; for the full contract.
;
; The three legacy board snippets (CYD, T-HMI, Cardputer) are kept as reference implementations
; under src/Hal/Boards/board_configs/examples/ and are NOT built by default.
; ------------------------------------------------------------------------------------------------

[platformio]
default_envs = esp32s3-default, esp32-default

[env]
; Dependencies shared by every environment. Environments inherit these; a child that declares its
; own `lib_deps` would replace (not extend) this list, so add new libraries here.
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson @ 7.1.0
	mathieucarbou/ESPAsyncWebServer @ 3.1.5
	links2004/WebSockets @ ^2.4.1

build_flags =
	-D KRYONOS_VERSION=\"2.0.1\"
	-D KRYONOS_API_LEVEL=2
	-D CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1

	; --- Display backend ---
	; Which KryonDisplay implementation the board file instantiates. This is compile-time, because
	; it picks a C++ type, so the value is a macro name and not a quoted string. The default is
	; KRYONOS_BACKEND_TFT_ESPI; select the RAM framebuffer to run with no panel attached:
	;     -D KRYONOS_DISPLAY_BACKEND=KRYONOS_BACKEND_RAM
	; See src/Hal/Display/DisplayConfig.h and Documentation/Display_Touch_Architecture.md §2.3.
	; -D KRYONOS_DISPLAY_BACKEND=KRYONOS_BACKEND_TFT_ESPI

; ================================================================================================
; ESP32-S3 (Xtensa LX7, 16 MB flash + PSRAM) — primary bring-up target
; ================================================================================================
[env:esp32s3-default]
; Pinned to the pioarduino espressif32 distribution (Arduino core 3.3.12 / IDF 5.5). The plain
; `espressif32` spec resolves to whatever happens to be installed under that name locally, which is
; not reproducible; see Documentation/Display_Touch_Architecture.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
monitor_speed = 115200

build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D TARGET_ESP32S3_DEFAULT=1
	-D BOARD_HAS_PSRAM
	-D CONFIG_SPIRAM_USE_MALLOC=1
	-D CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
	-D ARDUINO_LOOP_STACK_SIZE=32768
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

	; --- Logical canvas: CHANGE THESE for your panel (no code edits) ---
	; Must equal tft.width()/height() once tft.setRotation(KRYONOS_DISPLAY_ROTATION) has run.
	-D KRYONOS_DISPLAY_WIDTH=240
	-D KRYONOS_DISPLAY_HEIGHT=320
	-D KRYONOS_DISPLAY_ROTATION=0

	; --- TFT_eSPI display driver (pick the macro matching your controller) ---
	-D USER_SETUP_LOADED=1
	-D USE_HSPI_PORT=1
	-D ILI9341_DRIVER=1
	-D TFT_CS=10
	-D TFT_DC=9
	-D TFT_RST=8
	-D TFT_MISO=13
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000

	; --- Resistive touch (XPT2046, bit-banged by TouchDriver) ---
	; KRYONOS_TOUCH_DRIVER is auto-detected from these pins: all four present -> xpt2046-bitbang,
	; else TOUCH_CS -> xpt2046-tft, else none. Set it explicitly to override — the value is a
	; quoted string, e.g. for a capacitive panel:  -D KRYONOS_TOUCH_DRIVER=\"ft6236\"
	; (auto / xpt2046_bitbang / xpt2046_tft / ft6236 / gt911 / cst816 / null).
	; Capacitive controllers also need KRYONOS_TOUCH_I2C_SDA / _SCL, and KRYONOS_TOUCH_RST_PIN
	; if the reset line is wired. See Documentation/Display_Touch_Architecture.md §3.
	-D TOUCH_CS=7
	-D TOUCH_CLK=4
	-D TOUCH_DIN=5
	-D TOUCH_DO=6
	-D TOUCH_IRQ=14

	; --- Fonts ---
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	; SMOOTH_FONT is deliberately not enabled: TFT_eSPI's anti-aliased .vlw font renderer
	; costs flash and nothing in KryonOS loads a free font.

; ================================================================================================
; ESP32 (Xtensa LX6, 4 MB flash) — smallest supported target
; ================================================================================================
[env:esp32-default]
; Pinned to the pioarduino espressif32 distribution (Arduino core 3.3.12 / IDF 5.5). See above.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
; huge_app gives a 3 MB app partition against min_spiffs' 1.875 MB, at the cost of the second OTA
; slot — on a 4 MB ESP32 you cannot have a large app *and* two OTA slots. min_spiffs was full to
; 1,493 bytes, which blocked any further UI work on this target, so the app space wins here.
;
; Consequence: OTA *updates* do not work on this env. Update.begin() finds no update partition and
; fails with UPDATE_ERROR_NO_PARTITION, which OTAManager surfaces as an ordinary error — no crash,
; and confirmBootSuccessful() still marks the running app valid. The S3 default keeps full OTA.
; Give your own board a partition table sized to its actual flash.
board_build.partitions = huge_app.csv
monitor_speed = 115200

build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D TARGET_ESP32_DEFAULT=1
	-D ARDUINO_LOOP_STACK_SIZE=32768

	; --- Logical canvas: CHANGE THESE for your panel (no code edits) ---
	-D KRYONOS_DISPLAY_WIDTH=240
	-D KRYONOS_DISPLAY_HEIGHT=320
	-D KRYONOS_DISPLAY_ROTATION=0

	; --- TFT_eSPI display driver (VSPI pins by default on the classic ESP32) ---
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_CS=5
	-D TFT_DC=17
	-D TFT_RST=16
	-D TFT_MISO=19
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_BL=4
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000

	; --- Resistive touch (XPT2046, bit-banged by TouchDriver) ---
	; KRYONOS_TOUCH_DRIVER is auto-detected from these pins: all four present -> xpt2046-bitbang,
	; else TOUCH_CS -> xpt2046-tft, else none. Set it explicitly to override — the value is a
	; quoted string, e.g. for a capacitive panel:  -D KRYONOS_TOUCH_DRIVER=\"ft6236\"
	; (auto / xpt2046_bitbang / xpt2046_tft / ft6236 / gt911 / cst816 / null).
	; Capacitive controllers also need KRYONOS_TOUCH_I2C_SDA / _SCL, and KRYONOS_TOUCH_RST_PIN
	; if the reset line is wired. See Documentation/Display_Touch_Architecture.md §3.
	-D TOUCH_CS=15
	-D TOUCH_CLK=14
	-D TOUCH_DIN=13
	-D TOUCH_DO=12
	-D TOUCH_IRQ=27

	; --- Fonts ---
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1

; ================================================================================================
; ESP32-S31 (RISC-V, 320 MHz, Wi-Fi 6, 16 MB flash + 16 MB PSRAM) — preview
; ================================================================================================
; The S31 needs ESP-IDF 6.1, which only arduino-esp32 4.x uses. That core is not released yet, so
; this environment pins the pioarduino PRE-RELEASE platform 61.04.00-RC1 (Arduino 4.0.0-RC1 /
; IDF 6.1) — the only spec that ships an esp32s31 toolchain and the matching framework libs. The
; ESP32 and ESP32-S3 defaults above stay on the stable 55.03.312-1 (Arduino 3.3.12 / IDF 5.5.5);
; PlatformIO resolves `platform` per environment, so the two cores coexist in one project.
;
; The board is Espressif's own ESP32-S31-Function-CoreBoard-1 (board JSON in the platform). Pins
; below are placeholders mirroring the S3 default — set TFT_*/TOUCH_* to your actual wiring.
;
; DELIBERATELY NOT IN default_envs: this is a preview toolchain and the OS has not been ported to
; the Arduino 4.x API yet. Build it explicitly with `pio run -e esp32s31-default` and add it to
; default_envs once it compiles.
[env:esp32s31-default]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32-s31-coreboard-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

build_flags =
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D TARGET_ESP32S31_DEFAULT=1
	-D ARDUINO_LOOP_STACK_SIZE=32768

	; --- Logical canvas: CHANGE THESE for your panel (no code edits) ---
	-D KRYONOS_DISPLAY_WIDTH=240
	-D KRYONOS_DISPLAY_HEIGHT=320
	-D KRYONOS_DISPLAY_ROTATION=0

	; --- TFT_eSPI display driver ---
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_CS=10
	-D TFT_DC=9
	-D TFT_RST=8
	-D TFT_MISO=13
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000

	; --- Resistive touch (XPT2046, bit-banged by TouchDriver) ---
	; KRYONOS_TOUCH_DRIVER is auto-detected from these pins: all four present -> xpt2046-bitbang,
	; else TOUCH_CS -> xpt2046-tft, else none. Set it explicitly to override — the value is a
	; quoted string, e.g. for a capacitive panel:  -D KRYONOS_TOUCH_DRIVER=\"ft6236\"
	; (auto / xpt2046_bitbang / xpt2046_tft / ft6236 / gt911 / cst816 / null).
	; Capacitive controllers also need KRYONOS_TOUCH_I2C_SDA / _SCL, and KRYONOS_TOUCH_RST_PIN
	; if the reset line is wired. See Documentation/Display_Touch_Architecture.md §3.
	-D TOUCH_CS=7
	-D TOUCH_CLK=4
	-D TOUCH_DIN=5
	-D TOUCH_DO=6
	-D TOUCH_IRQ=14

	; --- Fonts ---
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	; SMOOTH_FONT is deliberately not enabled: TFT_eSPI's anti-aliased .vlw font renderer
	; costs flash and nothing in KryonOS loads a free font.
